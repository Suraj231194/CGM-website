<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t">
  <title id="t">Three connected devices on cards, with the continuous glucose monitor selected</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f1ea"/>
      <stop offset="1" stop-color="#e6f2f0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#7de3d3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7de3d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8683"/>
      <stop offset="1" stop-color="#1d5859"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#122326" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#122326" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <circle cx="320" cy="215" r="230" fill="url(#halo)"/>
  <g stroke="#1d5859" stroke-opacity="0.08" fill="none">
    <circle cx="320" cy="230" r="170"/>
    <circle cx="320" cy="230" r="220"/>
  </g>

  <!-- Left card: patch pump -->
  <g filter="url(#shadow)">
    <rect x="62" y="138" width="156" height="206" rx="26" fill="#ffffff"/>
  </g>
  <clipPath id="pod">
    <rect x="-46" y="-28" width="92" height="56" rx="26"/>
  </clipPath>
  <g transform="translate(140 214)" filter="url(#soft)">
    <rect x="-46" y="-28" width="92" height="56" rx="26" fill="#ffffff" stroke="#e3e9ea" stroke-width="2"/>
    <rect x="-46" y="8" width="92" height="20" fill="url(#teal)" clip-path="url(#pod)"/>
    <rect x="-20" y="-14" width="40" height="16" rx="8" fill="#d6ecea"/>
    <circle cx="30" cy="-14" r="3" fill="#7de3d3"/>
  </g>
  <rect x="96" y="276" width="88" height="10" rx="5" fill="#c7d2d4"/>
  <rect x="112" y="296" width="56" height="8" rx="4" fill="#e3e9ea"/>

  <!-- Right card: smart pen -->
  <g filter="url(#shadow)">
    <rect x="422" y="138" width="156" height="206" rx="26" fill="#ffffff"/>
  </g>
  <g transform="translate(500 214) rotate(-28)" filter="url(#soft)">
    <rect x="-62" y="-11" width="124" height="22" rx="11" fill="#ffffff" stroke="#e3e9ea" stroke-width="2"/>
    <path d="M-62 0 a11 11 0 0 1 11 -11 h33 v22 h-33 a11 11 0 0 1 -11 -11 z" fill="url(#teal)"/>
    <rect x="-8" y="-11" width="12" height="22" fill="#2f8683"/>
    <rect x="-26" y="-6" width="16" height="12" rx="3" fill="#122326"/>
  </g>
  <rect x="456" y="276" width="88" height="10" rx="5" fill="#c7d2d4"/>
  <rect x="472" y="296" width="56" height="8" rx="4" fill="#e3e9ea"/>

  <!-- Centre card: CGM, selected -->
  <g filter="url(#shadow)">
    <rect x="228" y="102" width="184" height="252" rx="30" fill="#ffffff"/>
  </g>
  <rect x="228" y="102" width="184" height="252" rx="30" fill="none" stroke="#2f8683" stroke-width="3"/>
  <ellipse cx="320" cy="238" rx="58" ry="12" fill="#122326" opacity="0.08"/>
  <g transform="translate(320 200)" filter="url(#soft)">
    <ellipse cx="0" cy="22" rx="64" ry="22" fill="#f3f1ea"/>
    <circle r="46" fill="#ffffff" stroke="#e3e9ea" stroke-width="2"/>
    <circle r="28" fill="none" stroke="url(#teal)" stroke-width="11"/>
    <circle r="16" fill="#f7f6f2"/>
    <circle cx="-30" cy="10" r="3" fill="#2f8683"/>
  </g>
  <rect x="264" y="282" width="112" height="12" rx="6" fill="#122326" opacity="0.85"/>
  <rect x="286" y="304" width="68" height="9" rx="4.5" fill="#c7d2d4"/>

  <!-- Selected badge -->
  <g transform="translate(404 110)">
    <circle r="22" fill="#1d5859"/>
    <circle r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M-9 0 l6 6 l12 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating comparison chips -->
  <g filter="url(#soft)">
    <rect x="82" y="382" width="142" height="40" rx="20" fill="#ffffff"/>
    <rect x="416" y="382" width="142" height="40" rx="20" fill="#ffffff"/>
    <rect x="249" y="382" width="142" height="40" rx="20" fill="#1d5859"/>
  </g>
  <circle cx="104" cy="402" r="8" fill="#d6ecea"/>
  <rect x="120" y="397" width="84" height="10" rx="5" fill="#c7d2d4"/>
  <circle cx="438" cy="402" r="8" fill="#d6ecea"/>
  <rect x="454" y="397" width="84" height="10" rx="5" fill="#c7d2d4"/>
  <circle cx="271" cy="402" r="8" fill="#7de3d3"/>
  <rect x="287" y="397" width="84" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
</svg>
