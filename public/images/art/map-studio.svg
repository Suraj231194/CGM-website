<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t">
  <title id="t">Stylised map of a coastal city with a location pin marking the office</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#afd9d6"/>
      <stop offset="1" stop-color="#d6ecea"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#122326" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#f3f1ea"/>

  <!-- Coastline -->
  <path d="M0 0 H150 C 130 60, 170 110, 140 170 C 110 230, 160 290, 130 400 H0 Z" fill="url(#sea)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M30 80 q12 -8 24 0 t24 0"/>
    <path d="M50 220 q12 -8 24 0 t24 0"/>
    <path d="M20 320 q12 -8 24 0 t24 0"/>
  </g>

  <!-- City blocks -->
  <g fill="#e7e3d8">
    <rect x="200" y="30" width="110" height="70" rx="10"/>
    <rect x="330" y="30" width="150" height="70" rx="10"/>
    <rect x="500" y="30" width="190" height="70" rx="10"/>
    <rect x="200" y="130" width="80" height="100" rx="10"/>
    <rect x="500" y="130" width="90" height="100" rx="10"/>
    <rect x="610" y="130" width="80" height="100" rx="10"/>
    <rect x="200" y="260" width="150" height="110" rx="10"/>
    <rect x="370" y="260" width="110" height="110" rx="10"/>
    <rect x="500" y="260" width="190" height="110" rx="10"/>
  </g>

  <!-- Park -->
  <rect x="300" y="130" width="180" height="100" rx="14" fill="#d6ecea"/>
  <g fill="#7fbfbb">
    <circle cx="330" cy="160" r="10"/>
    <circle cx="352" cy="196" r="12"/>
    <circle cx="450" cy="164" r="9"/>
    <circle cx="430" cy="204" r="11"/>
  </g>
  <path d="M310 214 C 360 170, 410 200, 470 146" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>

  <!-- Main roads -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M160 115 H720" stroke-width="16"/>
    <path d="M150 245 H720" stroke-width="16"/>
    <path d="M490 0 V400" stroke-width="14"/>
    <path d="M190 0 C 186 140, 190 260, 180 400" stroke-width="12"/>
  </g>
  <path d="M160 115 H720" fill="none" stroke="#f5b54a" stroke-width="2" stroke-dasharray="10 10" opacity="0.8"/>

  <!-- Pin -->
  <g transform="translate(490 245)">
    <circle r="54" fill="#2f8683" opacity="0.12"/>
    <circle r="32" fill="#2f8683" opacity="0.18"/>
    <g filter="url(#shadow)">
      <path d="M0 0 C -6 -18, -26 -30, -26 -54 a26 26 0 0 1 52 0 C 26 -30, 6 -18, 0 0 Z" fill="#1d5859"/>
    </g>
    <circle cy="-54" r="10" fill="#ffffff"/>
    <circle cy="-54" r="4" fill="#7de3d3"/>
  </g>
</svg>
